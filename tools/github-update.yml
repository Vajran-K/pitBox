# Keeps the deployed PitBox up to date by itself (free GitHub Actions).
#  - On race weekends it checks every 4 hours for newly finished races and qualifying sessions,
#    exports them, updates the standings, and redeploys if anything changed.
#  - Any code you push to main (web/, rooms/, deploy.mjs) is deployed straight away.
#  - "Run workflow" on the Actions tab runs it by hand.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see DEPLOY.md).
# The master copy is tools/github-update.yml; publish_to_github.bat copies it to .github/workflows/.
name: Update race data and deploy

on:
  schedule:
    - cron: "17 */4 * * 5,6,0,1" # every 4 h, Friday to Monday (UTC)
    - cron: "43 6 * * 3"         # Wednesday morning catch-all
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["web/**", "rooms/**", "deploy.mjs", ".github/workflows/update.yml"]

concurrency:
  group: pitbox-deploy
  cancel-in-progress: false

permissions:
  contents: write # to commit the new race data back to the repository

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            rooms/package-lock.json

      # the pipeline's HTTP cache (old seasons never change, so this saves thousands of requests)
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: pitbox-raw-${{ github.run_id }}
          restore-keys: pitbox-raw-

      # OpenF1 locks its free API while a session is live; then there's nothing new to fetch yet
      - name: Is OpenF1 open?
        id: openf1
        run: |
          code=$(curl -s -o /tmp/of1.txt -w '%{http_code}' "https://api.openf1.org/v1/sessions?session_key=latest")
          if [ "$code" = "401" ] && grep -qi "session in progress" /tmp/of1.txt; then
            echo "A session is live and OpenF1 is locked; the next scheduled run will pick it up."
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update race data
        if: steps.openf1.outputs.open == 'true' && github.event_name != 'push'
        env:
          PITBOX_LIVE_LOCK_MAX: "900"
        working-directory: pipeline
        run: |
          Y=$(date -u +%Y)
          python -u -m pipeline history --from "$Y" --to "$Y"
          python -u -m pipeline sessions --year "$Y" --type Race --skip-existing
          python -u -m pipeline sessions --year "$Y" --type Qualifying --skip-existing

      - name: Save download cache
        if: always() && steps.openf1.outputs.open == 'true' && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: pitbox-raw-${{ github.run_id }}

      # index.json changes on every run (timestamp, schedule); only real data changes count
      - name: Anything new?
        id: changes
        run: |
          n=$(git status --porcelain -- data/public | grep -v ' data/public/index.json$' | wc -l)
          echo "Changed data files: $n"
          if [ "$n" -gt 0 ] || [ "${{ github.event_name }}" != "schedule" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi

      - name: Commit new race data
        if: steps.changes.outputs.deploy == 'true'
        run: |
          git config user.name "pitbox-bot"
          git config user.email "pitbox-bot@users.noreply.github.com"
          git add data/public
          if git diff --cached --quiet; then echo "No data to commit."; exit 0; fi
          git commit -m "Race data update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Install
        if: steps.changes.outputs.deploy == 'true'
        run: |
          (cd web && npm ci --no-audit --no-fund)
          (cd rooms && npm ci --no-audit --no-fund)

      - name: Deploy to Cloudflare
        if: steps.changes.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy.mjs

      - name: Summary
        if: always()
        run: |
          if [ -f deployed.txt ]; then { echo '### Deployed'; echo '```'; cat deployed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else echo "Nothing new to deploy." >> "$GITHUB_STEP_SUMMARY"; fi
